name: Bug report
description: Report a reproducible problem in PADSwitcher
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove account names, emails, tokens, auth files, gateway files, and other personal data before submitting.
  - type: input
    id: version
    attributes:
      label: PADSwitcher version
      description: Shown in the executable filename or release page.
      placeholder: 1.19.1
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: Operating system and architecture
      placeholder: Ubuntu 24.04 x64 / macOS 15 arm64 / Ubuntu WSL2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Codex accounts or quota
        - VS Code connection
        - CLI connection
        - JetBrains connection
        - Kaggle accounts or notebooks
        - Interface or translation
        - Installation or update
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence that shows the problem.
      placeholder: |
        1. Open …
        2. Select …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact safe error text when useful. Do not paste credentials or app-data files.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add redacted screenshots or relevant Codex, Python, Kaggle CLI, VS Code, or JetBrains versions.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, account identifiers, gateway files, and other private data.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
