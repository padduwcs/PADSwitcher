name: Feature request
description: Suggest a focused improvement to PADSwitcher
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. Please do not include account credentials or private service data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or impossible today, and who does it affect?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the workflow you would like to use.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Codex
        - Kaggle
        - Integrations
        - Interface
        - Documentation
        - Packaging
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and releases for this request.
          required: true
        - label: This request does not require weakening credential storage, sandboxing, or tool approvals.
          required: true
