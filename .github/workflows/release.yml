name: Publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion."
          }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Windows releases must be commits on main.' }

      - run: npm ci

      - name: Install official Kaggle tools in an isolated environment
        run: |
          python -m venv artifacts/kaggle-sdk-probe
          & ./artifacts/kaggle-sdk-probe/Scripts/python.exe -m pip install 'kaggle==2.2.4' 'kagglesdk==0.1.37'

      - name: Offline Kaggle SDK contract checks
        run: '& ./artifacts/kaggle-sdk-probe/Scripts/python.exe -I test/kaggle-reader-test.py'

      - name: Install Codex for isolated protocol checks
        run: npm install --global @openai/codex@0.160.0

      - run: npm run check
      - run: npm test
      - run: npm run smoke
      - run: npm run smoke:protocol
      - run: npm run smoke:say-hi
      - run: npm run smoke:faults
      - run: npm run smoke:continuity
      - run: npm run smoke:desktop
      - run: npm run smoke:ui
      - run: npm run dist
      - run: node scripts/run-electron.cjs scripts/electron-packaged-smoke.cjs
      - run: npm run smoke:executables

      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $releaseFile = Get-Item -LiteralPath "dist/PADSwitcher-$version-Windows.exe"
          if (-not $releaseFile) { throw 'Portable executable was not produced.' }
          $releaseHash = (Get-FileHash -LiteralPath $releaseFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "$($releaseFile.FullName).sha256",
            "$releaseHash  $($releaseFile.Name)`n",
            [Text.UTF8Encoding]::new($false)
          )

      - name: Verify uploaded draft assets and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $releaseFile = Get-Item -LiteralPath "dist/PADSwitcher-$version-Windows.exe"
          $assets = @($releaseFile.FullName, "$($releaseFile.FullName).sha256")
          $draft = gh release view $env:GITHUB_REF_NAME --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw 'Refusing to overwrite a public release.' }
            gh release upload $env:GITHUB_REF_NAME --clobber @assets
          } else {
            gh release create $env:GITHUB_REF_NAME --verify-tag --draft --title "PADSwitcher $version" --notes-file "docs/releases/v$version.md" @assets
          }
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed.' }
          $api = gh release view $env:GITHUB_REF_NAME --json apiUrl --jq '.apiUrl'
          gh api $api > release-metadata.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read draft metadata.' }
          node scripts/verify-windows-release.cjs release-metadata.json
          if ($LASTEXITCODE -ne 0) { throw 'Asset verification failed; release remains draft.' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed.' }
