name: Windows checks and portable build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Codex for isolated protocol checks
        run: npm install --global @openai/codex@0.160.0
      - run: npm run check
      - run: npm test
      - run: npm run smoke:quota:with-web
      - run: npm run smoke
      - run: npm run smoke:protocol
      - run: npm run smoke:web:protocol
      - run: npm run smoke:protocol:web-enabled
      - run: npm run smoke:ui
      - run: npm run dist
      - name: Web bridge tests (Bun)
        working-directory: vendor/codex-chatgpt-web
        shell: pwsh
        run: '& "${{ github.workspace }}/artifacts/build-tools/node_modules/@oven/bun-windows-x64/bin/bun.exe" test ./tests'
      - name: Install launcher Electron for Node-based tests
        run: node vendor/codex-chatgpt-web/launcher/node_modules/electron/install.js
      - name: Web launcher tests (Node)
        working-directory: vendor/codex-chatgpt-web/launcher
        run: node --test tests/*.test.cjs
      - run: node scripts/run-electron.cjs scripts/electron-packaged-smoke.cjs
      - run: node scripts/run-electron.cjs scripts/web-companion-smoke.cjs --packaged
      - name: SHA-256
        shell: pwsh
        run: |
          $releaseFile = Get-ChildItem -LiteralPath dist -Filter 'PADSwitcher-*-Windows.exe' | Select-Object -First 1
          $releaseHash = (Get-FileHash -LiteralPath $releaseFile.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$($releaseFile.FullName).sha256", "$releaseHash  $($releaseFile.Name)`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        with:
          name: PADSwitcher-Windows
          path: |
            dist/PADSwitcher-*-Windows.exe
            dist/PADSwitcher-*-Windows.exe.sha256
          if-no-files-found: error
